# 태그 -> 관절중심 오프셋 실측 기록 (로드맵 D3)
#
# [측정 자세] 팔을 몸 옆에 자연스럽게 편 채로 카메라를 정면으로 바라보고 섬 (어제 캘리브레이션 때와 동일 자세 권장)
#
# [along_bone_cm] 태그 "중심"에서 인접 관절(S=어깨, E=팔꿈치, W=손목) "중심"까지,
#   뼈(팔/몸) 축 방향을 따라 잰 직선 거리(cm). 줄자를 태그 중심에 대고 관절이 접히는
#   지점까지 쭉 당겨서 측정. 태그가 비스듬히 붙어있어도 "뼈 방향 성분"만 잰다.
#
# [depth_cm] 태그가 붙은 위치의 팔/몸 둘레를 줄자로 한 바퀴 재서 2로 나눈 값(cm).
#   태그는 피부/옷 표면에 붙어있고 관절중심은 몸 속(뼈 중심)에 있기 때문에,
#   표면→중심 깊이를 둘레/2로 근사해서 보정하는 용도.
#
# 이 3가지(along_bone, depth, + 태그 자체의 pose)를 합치면 태그 pose만으로
# 관절중심 위치를 역산할 수 있음 (D4에서 사용 예정).

T0_torso:
  tag_id: 0
  to_shoulder_S:
    along_bone_cm: 25   # 가슴 태그 중심 -> 어깨(S) 관절중심, 수평 방향 거리
    depth_cm: 51        # 태그 붙은 높이에서 가슴 둘레 / 2

T1_upperarm:
  tag_id: 1
  to_shoulder_S:
    along_bone_cm: 17   # 상완 태그 중심 -> 어깨(S), 팔 길이 방향 거리
  to_elbow_E:
    along_bone_cm: 17   # 상완 태그 중심 -> 팔꿈치(E), 팔 길이 방향 거리
  depth_cm: 16          # 태그 붙은 위치에서 상완 둘레 / 2

T2_forearm:
  tag_id: 2
  mount_sign: -1   # 자동 테스트로 결정: 태그가 "위쪽=손목" 방향으로 뒤집혀 붙은 것으로 보여 부호 반전
  to_elbow_E:
    along_bone_cm: 14   # 전완 태그 중심 -> 팔꿈치(E), 팔 길이 방향 거리
  to_wrist_W:
    along_bone_cm: 15   # 전완 태그 중심 -> 손목(W), 팔 길이 방향 거리
  depth_cm: 14          # 태그 붙은 위치에서 전완 둘레 / 2

T3_hand:
  tag_id: 3
  to_wrist_W:
    along_bone_cm: 6   # 손등 태그 중심 -> 손목(W) 관절중심 거리
  depth_cm: 10          # 태그 붙은 위치에서 손 두께 / 2

notes: ""   # 측정하면서 특이사항 있으면 자유롭게 적기 (예: 팔 자세, 태그 틀어짐 등)